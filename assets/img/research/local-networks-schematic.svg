<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local networks, global approximation</title>
  <desc id="desc">
    Three local neural-network models cover overlapping parts of a domain. Their contributions are combined into a global approximation. This is a
    schematic, not experimental data.
  </desc>
  <rect width="960" height="540" fill="#fff" />
  <g font-family="Arial, sans-serif" fill="#0c2340" text-anchor="middle">
    <text x="480" y="56" font-size="30" font-weight="bold">Local networks, global approximation</text>
    <text x="480" y="88" font-size="18">A schematic of domain-decomposed learning</text>
    <rect x="100" y="128" width="300" height="60" rx="8" fill="#0076c2" opacity=".2" />
    <rect x="330" y="128" width="300" height="60" rx="8" fill="#00a6d6" opacity=".3" />
    <rect x="560" y="128" width="300" height="60" rx="8" fill="#0076c2" opacity=".2" />
    <text x="250" y="163" font-size="18">Local region 1</text>
    <text x="480" y="163" font-size="18">Local region 2</text>
    <text x="710" y="163" font-size="18">Local region 3</text>
    <g fill="none" stroke="#0076c2" stroke-width="2">
      <path d="M250 198V230M480 198V230M710 198V230M250 320V353L430 395M480 320V395M710 320V353L530 395" />
    </g>
    <g fill="#f0f6fa" stroke="#0076c2" stroke-width="2">
      <rect x="135" y="232" width="230" height="88" rx="12" />
      <rect x="365" y="232" width="230" height="88" rx="12" />
      <rect x="595" y="232" width="230" height="88" rx="12" />
    </g>
    <text x="250" y="270" font-size="21">Local network 1</text>
    <text x="480" y="270" font-size="21">Local network 2</text>
    <text x="710" y="270" font-size="21">Local network 3</text>
    <text x="250" y="297" font-size="16">Learn a local contribution</text>
    <text x="480" y="297" font-size="16">Learn a local contribution</text>
    <text x="710" y="297" font-size="16">Learn a local contribution</text>
    <rect x="270" y="397" width="420" height="70" rx="12" fill="#0c2340" />
    <text x="480" y="440" fill="#fff" font-size="23">Combine into a global approximation</text>
    <text x="480" y="510" font-size="16">SCaLA · Conceptual illustration, not numerical results</text>
  </g>
</svg>
