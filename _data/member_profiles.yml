  biography:
    - Alexander Heinlein is an assistant professor in the Numerical Analysis group of
      the Delft Institute of Applied Mathematics (DIAM), Faculty of Electrical Engineering,
      Mathematics & Computer Science, at TU Delft. He leads SCaLA—Scalable Scientific
      and Learning Algorithms.
    - His research focuses on numerical methods for partial differential equations and
      scientific computing, in particular domain decomposition and multiscale methods.
      His work combines mathematical foundations, scalable algorithms, implementation
      on current CPU and GPU architectures, and applications to complex scientific problems.
      He also works on scientific machine learning, connecting scientific computing
      with machine learning.
  research_interests:
    - Domain decomposition, preconditioning, and scalable linear and nonlinear solvers
    - Multiscale discretisations for heterogeneous problems
    - High-performance computing on CPU and GPU architectures
    - Scientific machine learning
    - Multiphysics problems and fluid–structure interaction
